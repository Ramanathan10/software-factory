<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Factory · story lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle · Software Factory</p>
    <h1>How one story moves from plan to merge</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
        <title id="lifecycle-title">Software Factory story lifecycle</title>
        <desc id="lifecycle-desc">A story advances through plan, test-first, implement, verify and pull request; a failed gate or review finding returns it to implement, surviving mutants return it to test-first, any phase can pause for the owner's decision, and a merged pull request closes the story.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text x="40" y="56" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PRIMARY PHASES · AI-SDLC 0–9</text>
        <text x="40" y="340" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">INTERRUPTION</text>
        <text x="792" y="340" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">TERMINAL OUTCOME</text>

        <g id="plan-to-test-first">
          <line x1="168" y1="100" x2="228" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="172" y="80" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="198" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>
        </g>

        <g id="test-first-to-implement">
          <line x1="356" y1="100" x2="416" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="370" y="80" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="386" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RED</text>
        </g>

        <g id="implement-to-verify">
          <line x1="544" y1="100" x2="604" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="554" y="80" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="574" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN</text>
        </g>

        <g id="verify-to-pull-request">
          <line x1="732" y1="100" x2="792" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="736" y="80" width="52" height="12" rx="2" fill="#f5f5f5"/>
          <text x="762" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SIGN-OFF</text>
        </g>

        <g id="verify-to-implement">
          <path d="M 648,128 V 160 Q 648,168 640,168 H 508 Q 500,168 500,160 V 128" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect x="532" y="174" width="84" height="12" rx="2" fill="#f5f5f5"/>
          <text x="574" y="183" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GATE · FINDING</text>
        </g>

        <g id="verify-to-test-first">
          <path d="M 688,128 V 200 Q 688,208 680,208 H 300 Q 292,208 292,200 V 128" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <rect x="432" y="214" width="72" height="12" rx="2" fill="#f5f5f5"/>
          <text x="468" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LIVE MUTANTS</text>
        </g>

        <g id="plan-to-owner-decides">
          <line x1="72" y1="128" x2="72" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="80" y="172" width="32" height="12" rx="2" fill="#f5f5f5"/>
          <text x="96" y="181" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ASKS</text>
        </g>

        <g id="owner-decides-to-plan">
          <line x1="136" y1="264" x2="136" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="146" y="214" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="170" y="223" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSWERS</text>
        </g>

        <g id="pull-request-to-closed">
          <line x1="856" y1="128" x2="856" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
          <rect x="866" y="190" width="44" height="12" rx="2" fill="#f5f5f5"/>
          <text x="888" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGED</text>
        </g>

        <g id="plan">
          <rect x="40" y="72" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="40" y="72" width="128" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="48" y="78" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="76" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PHASE 0–1</text>
          <text x="104" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Plan</text>
          <text x="104" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">preflight · spec</text>
        </g>

        <g id="test-first">
          <rect x="228" y="72" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="228" y="72" width="128" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="236" y="78" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="260" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PHASE 2</text>
          <text x="292" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Test-first</text>
          <text x="292" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">failing tests</text>
        </g>

        <g id="implement">
          <rect x="416" y="72" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="416" y="72" width="128" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="424" y="78" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="448" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PHASE 3</text>
          <text x="480" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Implement</text>
          <text x="480" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">smallest change</text>
        </g>

        <g id="verify">
          <rect x="604" y="72" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="604" y="72" width="128" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="612" y="78" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="640" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PHASE 4–5</text>
          <text x="668" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verify</text>
          <text x="668" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gates · review</text>
        </g>

        <g id="pull-request">
          <rect x="792" y="72" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="792" y="72" width="128" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="800" y="78" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="828" y="87" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PHASE 6–9</text>
          <text x="856" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pull request</text>
          <text x="856" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">evidence · CI · retro</text>
        </g>

        <g id="owner-decides">
          <rect x="40" y="264" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="40" y="264" width="128" height="56" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <rect x="48" y="270" width="32" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
          <text x="64" y="279" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>
          <text x="104" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner decides</text>
          <text x="104" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">question · approval</text>
        </g>

        <g id="closed">
          <rect x="792" y="264" width="128" height="56" rx="8" fill="#f5f5f5"/>
          <rect x="792" y="264" width="128" height="56" rx="8" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
          <rect x="796" y="268" width="120" height="48" rx="5" fill="none" stroke="#2d3142" stroke-width="1"/>
          <text x="856" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Closed</text>
          <text x="856" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">merged · cleaned up</text>
        </g>

        <text x="480" y="286" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Any phase can pause for the owner,</text>
        <text x="480" y="306" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">or return to Plan on a replan.</text>

        <line x1="40" y1="364" x2="920" y2="364" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="378" width="16" height="10" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">PHASE</text>
        <rect x="200" y="378" width="16" height="10" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="224" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">WAITS ON OWNER</text>
        <rect x="336" y="378" width="16" height="10" rx="3" fill="rgba(45,49,66,0.05)" stroke="#2d3142" stroke-width="1"/>
        <rect x="338" y="380" width="12" height="6" rx="1.5" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="360" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">TERMINAL</text>
        <line x1="440" y1="384" x2="464" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="472" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">ADVANCE</text>
        <line x1="544" y1="384" x2="568" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="576" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">RETURN FOR REWORK</text>
      </svg>
    </div>
  </div>
</body>
</html>
